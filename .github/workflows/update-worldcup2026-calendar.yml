name: Update World Cup 2026 calendar

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: fifa-world-cup-2026
        run: pip install -r requirements.txt

      - name: Generate calendar
        working-directory: fifa-world-cup-2026
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/generate_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fifa-world-cup-2026/worldcup2026.ics
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update World Cup 2026 calendar"
            git push
          fi
