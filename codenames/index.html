<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Codenames</title>
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Codenames%22,%22short_name%22:%22Codenames%22,%22display%22:%22fullscreen%22,%22orientation%22:%22landscape%22,%22start_url%22:%22.%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23ffffff%22}" />
  <style>
    :root {
      --red: #d71920;
      --blue: #315fb8;
      --neutral: #e8e8e8;
      --neutral-dark: #d9d9d9;
      --revealed-neutral: #ecd99f;
      --assassin: #111;
      --text: #050505;
      --white: #fff;
      --border: #f0f0f0;
      --button-bg: #f8f8f8;
      --button-border: #c7c7c7;
      --settings-bg: rgba(255,255,255,0.96);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: white;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: calc(100dvh + 520px);
      overscroll-behavior: none;
    }

    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: 6.1dvh 1px 5.8dvh minmax(0, 1fr) 9.2dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: var(--white);
      color: var(--text);
    }

    .app.dark {
      --neutral: #2b2b2b;
      --neutral-dark: #3a3a3a;
      --revealed-neutral: #d8c27f;
      --text: #f3f3f3;
      --white: #111;
      --border: #242424;
      --button-bg: #222;
      --button-border: #555;
      --settings-bg: rgba(18,18,18,0.97);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.36em;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: clamp(16px, 2.1vw, 28px);
    }

    .rule { background: var(--border); }

    .status {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score {
      position: absolute;
      left: 1.25vw;
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(19px, 2.2vw, 34px);
    }

    .score .red { color: var(--red); }
    .score .blue { color: var(--blue); }

    
    
    main.board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: clamp(6px, 0.9vmin, 12px);
      padding: 0.35vh 1vw 1.45vh;
      min-height: 0;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: var(--neutral);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(17px, 1.95vw, 33px);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
      text-align: center;
      padding: 0.25em;
      user-select: none;
    }

    .card span { z-index: 2; }

    .card.image-card span {
      font-size: clamp(24px, 3.25vw, 54px);
      line-height: 1;
    }

    .card.pending::before {
      content: '';
      position: absolute;
      inset: 0;
      transform-origin: left;
      animation: fill 3s linear forwards, flash 400ms infinite;
    }

    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes flash {
      0% { background: var(--red); }
      33% { background: var(--blue); }
      66% { background: #999; }
      100% { background: var(--red); }
    }

    .card.reveal-anim { animation: revealPop 400ms ease; }
    @keyframes revealPop {
      0% { transform: scale(1); filter: brightness(1); }
      40% { transform: scale(1.15); filter: brightness(1.4); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .card.revealed.red { background: var(--red); color: white; }
    .card.revealed.blue { background: var(--blue); color: white; }
    .card.revealed.neutral { background: var(--revealed-neutral); color: #111; }
    .card.revealed.assassin { background: black; color: white; }

    .spymaster .card:not(.revealed).red { background: rgba(215, 25, 32, 0.25); }
    .spymaster .card:not(.revealed).blue { background: rgba(49, 95, 184, 0.25); }
    .spymaster .card:not(.revealed).neutral { background: rgba(216, 185, 103, 0.42); }
    .spymaster .card:not(.revealed).assassin { background: rgba(0,0,0,0.4); color: white; }

    .screen-shake { animation: screenShake 520ms ease-in-out; }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      12% { transform: translate(-10px, 5px); }
      24% { transform: translate(9px, -6px); }
      36% { transform: translate(-7px, -4px); }
      48% { transform: translate(8px, 4px); }
      60% { transform: translate(-5px, 3px); }
      72% { transform: translate(4px, -3px); }
      84% { transform: translate(-2px, 2px); }
    }

    .effects-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 800;
      pointer-events: none;
      display: none;
    }

    .effects-canvas.show { display: block; }

    footer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 1.7vh max(2vw, env(safe-area-inset-right)) 1.25vh max(2vw, env(safe-area-inset-left));
      overflow-x: auto;
    }

    .control-btn {
      border: 1px solid var(--button-border);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--text);
      font-size: clamp(10px, 0.9vw, 14px);
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0.55em 0.9em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-decoration: none;
      white-space: nowrap;
    }

    .control-btn:active { transform: translateY(1px); }
    .end-turn:active { transform: translateY(-50%); }
    .control-btn.active { background: var(--text); color: var(--white); }
    .settings-btn { min-width: 2.5em; padding-inline: 0.75em; }

    .footer-section,
    .source-picker {
      display: flex;
      align-items: center;
      gap: 0.55vw;
      margin-left: 1vw;
      padding-left: 1vw;
      border-left: 1px solid var(--button-border);
    }

    .settings-section { margin-left: 0; padding-left: 0; border-left: none; }

    .source-option {
      min-width: 2.7em;
      text-align: center;
      padding-inline: 0.75em;
      font-size: clamp(10px, 0.9vw, 14px);
      line-height: normal;
      position: relative;
      overflow: hidden;
    }

    .file-source-option input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .settings-panel {
      position: absolute;
      right: 1.25vw;
      bottom: 5.6vh;
      z-index: 5;
      display: none;
      flex-direction: column;
      gap: 0.75em;
      width: min(420px, 60vw);
      padding: 0.95em 1.05em;
      border: 1px solid var(--button-border);
      border-radius: 14px;
      background: var(--settings-bg);
      color: var(--text);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      font-size: clamp(12px, 1vw, 16px);
    }

    .settings-panel.open { display: flex; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1em;
      white-space: nowrap;
    }

    .setting-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--blue);
    }

    .loading-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .loading-modal.show { display: flex; }

    .loading-box {
      background: var(--white);
      color: var(--text);
      padding: 1.5em 2em;
      border-radius: 14px;
      font-weight: 700;
      font-size: clamp(14px, 1.2vw, 20px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    @media (max-height: 520px) and (orientation: landscape) {
      header { font-size: clamp(14px, 1.7vw, 22px); }
      .turn { font-size: clamp(18px, 2vw, 28px); }
      .score { font-size: clamp(17px, 2vw, 28px); }
      .card.image-card span { font-size: clamp(22px, 3vw, 48px); }
      .control-btn, .source-option { font-size: clamp(9px, 0.8vw, 12px); padding: 0.5em 0.78em; }
    }

    @media (orientation: portrait) {
      body::after {
        content: 'Rotate to landscape';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        font-size: 24px;
        z-index: 99;
      }
    }
  </style>
</head>

      const categories = shuffle(Object.keys(dedupedImageCategories));
      const selected = [];
      const selectedSet = new Set();
      const categoryCounts = Object.fromEntries(categories.map(category => [category, 0]));

      let categoryIndex = 0;

      while (selected.length < 25 && categoryIndex <= 500) {
        const category = categories[categoryIndex % categories.length];

          const pool = shuffle(dedupedImageCategories[category]).filter(item => !selectedSet.has(item));
          if (pool.length) {
            selected.push(pool[0]);
            selectedSet.add(pool[0]);
            categoryCounts[category] += 1;
          }
        }
        categoryIndex++;
      }

      return selected.length >= 25 ? selected : shuffle(dedupeItems(banks.images)).slice(0, 25);
    }

    function getCurrentBank() {
      if (selectedSource === 'images') return getBalancedImageBank();
      const bank = banks[selectedSource] || banks.english;
      return bank.length >= 25 ? dedupeItems(bank) : banks.english;
    }

    function makeRoles() {
      const startingTeam = Math.random() < 0.5 ? 'red' : 'blue';
      return {
        startingTeam,
        roles: shuffle([
          ...Array(startingTeam === 'red' ? 9 : 8).fill('red'),
          ...Array(startingTeam === 'blue' ? 9 : 8).fill('blue'),
          ...Array(7).fill('neutral'),
          'assassin'
        ])
      };
    }

    function base64UrlEncode(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = '';
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function base64UrlDecode(value) {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((value.length + 3) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function validateSharedGame(payload) {
      if (!payload || payload.v !== 1) return false;
      if (!Array.isArray(payload.w) || !Array.isArray(payload.r)) return false;
      if (payload.w.length !== 25 || payload.r.length !== 25) return false;
      if (payload.x && (!Array.isArray(payload.x) || payload.x.length !== 25)) return false;
      const validRoles = new Set(['red', 'blue', 'neutral', 'assassin']);
      return payload.w.every(item => typeof item === 'string') && payload.r.every(role => validRoles.has(role));
    }

    function getShareableGameUrl() {
      const payload = {
        v: 1,
        w: state.words,
        r: state.roles,
        x: state.revealed,
        s: state.source,
        t: state.turn
      };
      const url = new URL(window.location.href);
      url.searchParams.set('game', base64UrlEncode(JSON.stringify(payload)));
      url.hash = '';
      return url.toString();
    }

    function loadSharedGameFromUrl() {
      const encoded = new URLSearchParams(window.location.search).get('game');
      if (!encoded) return false;
      try {
        const payload = JSON.parse(base64UrlDecode(encoded));
        if (!validateSharedGame(payload)) throw new Error('Invalid shared game');
        selectedSource = payload.s || 'english';
        previousSourceSelection = selectedSource;
        state = {
          words: [...payload.w],
          roles: [...payload.r],
          revealed: payload.x ? [...payload.x].map(Boolean) : Array(25).fill(false),
          source: selectedSource,
          pending: null,
          pendingTimer: null,
          lastRevealed: null,
          turn: payload.t === 'blue' ? 'blue' : 'red',
          spymaster: false,
          darkMode: false,
          spymasterMayGuess: false
        };
        render();
        return true;
      } catch (error) {
        alert('This shared game link could not be loaded. Starting a new game instead.');
        const url = new URL(window.location.href);
        url.searchParams.delete('game');
        window.history.replaceState({}, '', url.toString());
        return false;
      }
    }

    async function shareGameLink() {
      const link = getShareableGameUrl();
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Codenames game', url: link });
          return;
        } catch (error) {
          if (error.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(link);
        const original = els.shareGameBtn.textContent;
        els.shareGameBtn.textContent = 'Copied!';
        setTimeout(() => { els.shareGameBtn.textContent = original; }, 1400);
      } catch (error) {
        window.prompt('Copy this game link:', link);
      }
    }

    function newGame(saveCurrent = false) {
      if (saveCurrent && state.words) previousGameState = cloneGameState(state);
      const setup = makeRoles();
      state = {
        words: shuffle(getCurrentBank()).slice(0,25),
        roles: setup.roles,
        revealed: Array(25).fill(false),
        source: selectedSource,
        pending: null,
        pendingTimer: null,
        lastRevealed: null,
        turn: setup.startingTeam,
        spymaster: false,
        darkMode: state.darkMode || false,
        spymasterMayGuess: state.spymasterMayGuess || false
      };
      render();
    }

    function render() {
      els.app.classList.toggle('dark', state.darkMode);
      els.app.classList.toggle('spymaster', state.spymaster);
      let redRemaining = 0;
      let blueRemaining = 0;
      state.roles.forEach((role, i) => {
        if (state.revealed[i]) return;
        if (role === 'red') redRemaining += 1;
        if (role === 'blue') blueRemaining += 1;
      });
      els.redScore.textContent = redRemaining;
      els.blueScore.textContent = blueRemaining;

      els.playerBtn.classList.toggle('active', !state.spymaster);
      els.spymasterBtn.classList.toggle('active', state.spymaster);
      els.darkModeToggle.checked = state.darkMode;
      els.spymasterGuessToggle.checked = state.spymasterMayGuess;
      els.sourceOptions.forEach(option => option.classList.toggle('active', option.dataset.source === selectedSource));

      const fragment = document.createDocumentFragment();
      state.words.forEach((w, i) => {
        const el = document.createElement('div');
        const role = state.roles[i];
        const isImage = state.source === 'images';
        el.className = 'card ' + role + (isImage ? ' image-card' : '') + (state.revealed[i] ? ' revealed' : '') + (state.lastRevealed === i ? ' reveal-anim' : '') + (state.pending === i ? ' pending' : '');
        const label = document.createElement('span');
        label.textContent = w;
        el.appendChild(label);
        el.onclick = () => handleCardClick(i);
        fragment.appendChild(el);
      });

      els.board.replaceChildren(fragment);
    }

    function handleCardClick(i) {
      if (state.spymaster && !state.spymasterMayGuess) return;
      if (state.pending === i) { clearPending(); render(); return; }
      if (state.pending !== null) clearPending();
      if (state.revealed[i]) {
        state.revealed[i] = false;
        if (state.lastRevealed === i) state.lastRevealed = null;
        render();
        return;
      }
      state.pending = i;
      state.lastRevealed = null;
      render();
      state.pendingTimer = setTimeout(() => {
        if (state.pending !== i) return;
        const revealedRole = state.roles[i];
        state.revealed[i] = true;
        state.pending = null;
        state.pendingTimer = null;
        state.lastRevealed = i;
        render();
        handleRevealOutcome(revealedRole);
      }, 2850);
    }

    function teamRemaining(team) {
      return state.roles.filter((role, index) => role === team && !state.revealed[index]).length;
    }

    function handleRevealOutcome(role) {
      if (role === 'assassin') { launchBombExplosion(); return; }
      if (role === 'red' && teamRemaining('red') === 0) launchFireworks('red');
      if (role === 'blue' && teamRemaining('blue') === 0) launchFireworks('blue');
    }

    function launchBombExplosion() {
      const app = els.app;
      app.classList.remove('screen-shake');
      void app.offsetWidth;
      app.classList.add('screen-shake');
      const canvas = els.effectsCanvas;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      canvas.classList.add('show');
      const particles = [];
      for (let p = 0; p < 900; p++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 6 + Math.random() * 22;
        particles.push({ x: Math.random() * width, y: Math.random() * height, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 45 + Math.random() * 55, size: 3 + Math.random() * 10, color: Math.random() < 0.55 ? '#111111' : (Math.random() < 0.5 ? '#ff8a00' : '#666666') });
      }
      let frame = 0;
      function animate() {
        frame++;
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.vy += 0.08; p.life -= 1;
          ctx.globalAlpha = Math.max(p.life / 80, 0);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = Math.max(0.6 - frame / 60, 0);
        ctx.fillStyle = frame < 10 ? 'white' : 'rgba(255,140,0,0.4)';
        ctx.fillRect(0, 0, width, height);
        ctx.globalAlpha = 1;
        if (frame < 120) requestAnimationFrame(animate);
        else { canvas.classList.remove('show'); ctx.clearRect(0, 0, width, height); app.classList.remove('screen-shake'); }
      }
      animate();
    }

    function launchFireworks(team) {
      const canvas = els.effectsCanvas;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      canvas.classList.add('show');
      const color = team === 'red' ? '#d71920' : '#315fb8';
      const accent = team === 'red' ? '#ffef6e' : '#ffffff';
      const particles = [];
      for (let b = 0; b < 22; b++) {
        const cx = width * (0.12 + Math.random() * 0.76);
        const cy = height * (0.12 + Math.random() * 0.62);
        for (let p = 0; p < 72; p++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.8 + Math.random() * 10;
          particles.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 90 + Math.random() * 60, size: 2.2 + Math.random() * 5.2, color: Math.random() < 0.78 ? color : accent });
        }
      }
      let frame = 0;
      function animate() {
        frame++;
        ctx.clearRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.055; p.vx *= 0.985; p.vy *= 0.985; p.life -= 1;
          ctx.globalAlpha = Math.max(p.life / 80, 0);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        const label = `${team.toUpperCase()} WINS!`;
        const fontSize = Math.min(width, height) * 0.105;
        ctx.font = `900 ${fontSize}px Arial, Helvetica, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = Math.max(7, fontSize * 0.08);
        ctx.strokeStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 18;
        ctx.strokeText(label, width / 2, height / 2);
        ctx.shadowBlur = 0; ctx.fillStyle = team === 'red' ? '#9f0f15' : '#153e92'; ctx.fillText(label, width / 2, height / 2);
        if (frame < 260) requestAnimationFrame(animate);
        else { canvas.classList.remove('show'); ctx.clearRect(0, 0, width, height); }
      }
      animate();
    }

      function looksLikeVerb(word) {
        if (commonSpanishVerbs.has(word) || commonEnglishVerbs.has(word)) return true;

      function getWordFamilyKey(word) {
        // Used only for deduping similar variants. The displayed word is never modified.
        let key = word;

        // - perros/perras -> perro/perra
        // - canciones -> cancion
        // - avoid breaking words like viernes, despues, ingles

        score *= recencyWeight;

        if (docFrequency === 1 && count < 2.2) score *= 0.55;
        if (count > 18) score *= 0.8;
        return score;
      }

      const cleaned = basicNormalize(originalText)
        .replace(/<media omitted>|media omitted|image omitted|video omitted|audio omitted|sticker omitted/gi, ' ')
        .replace(/https?:\/\/\S+/g, ' ')
        .replace(/\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b/g, ' ')
        .replace(/\b\d{1,2}:\d{2}(?:\s?[ap]m)?\b/gi, ' ')
        .replace(/\b\d+[.,]?\d*\s?(usd|ars|eur|pesos?|dolares?|dólares?|k|m2|m²|amb|ambientes?)\b/gi, ' ')
        .replace(/\b[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}\b/gi, ' ')
        .replace(/[^a-zñü\s]/gi, ' ');

      const rawTokens = cleaned.split(/\s+/).filter(Boolean);
      const counts = new Map();
      const firstSeen = new Map();
      const total = Math.max(rawTokens.length, 1);

      rawTokens.forEach((rawWord, index) => {
        const word = rawWord;
        if (!isGoodShape(word)) return;
        if (stopWords.has(word) || weakWords.has(word) || spanishFunctionWords.has(word) || whatsappNoise.has(word) || monthsAndDays.has(word) || placeNoise.has(word)) return;
        if (looksLikeVerb(word) || looksLikeAbstractOrProcess(word) || looksLikeProperName(word)) return;

        if (/^(www|http|https|com|net|org|jpeg|jpg|png|mov|mp4|opus|webp)$/.test(word)) return;

        const previous = counts.get(word) || 0;
        const rarityBoost = previous === 0 ? 1 : 0.85;
        counts.set(word, previous + rarityBoost);
        if (!firstSeen.has(word)) firstSeen.set(word, index);
      });

      const rankedWords = [...counts.entries()]
        .map(([word, count]) => [word, wordScore(word, count, count, firstSeen.get(word) || 0, total)])
        .filter(([word, score]) => score >= 1.35)
        .sort((a, b) => {
          const [wordA, scoreA] = a;
          const [wordB, scoreB] = b;
          const diff = scoreB - scoreA;
          if (Math.abs(diff) > 0.2) return diff;
          return (wordB.length - wordA.length) || ((firstSeen.get(wordA) || 0) - (firstSeen.get(wordB) || 0));
        });

      function isLaughLikeWord(word) {
        return word.includes('jaja') || word.includes('haha');
      }

      const seenFamilies = new Set();
      const finalWords = [];
      let hasLaughLikeWord = false;
      rankedWords.forEach(([word]) => {
        const familyKey = getWordFamilyKey(word);
        if (seenFamilies.has(familyKey)) return;
        if (isLaughLikeWord(word)) {
          if (hasLaughLikeWord) return;
          hasLaughLikeWord = true;
        }
        seenFamilies.add(familyKey);
        finalWords.push(word.toUpperCase());
      });

      return finalWords.slice(0, 80);
    }

    async function extractTextFromZip(file) {
      if (!window.JSZip) {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        document.head.appendChild(script);
        await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
      }

      const zip = await JSZip.loadAsync(file);
      let combined = '';
      const textLikeFiles = Object.values(zip.files).filter(f => {
        if (f.dir) return false;
        const name = f.name.toLowerCase();
        return name.endsWith('.txt') || name.endsWith('.text') || name.endsWith('.csv');
      });

      for (const f of textLikeFiles) {
        try {
          combined += '\n' + await f.async('string');
        } catch (error) {
          const buffer = await f.async('arraybuffer');
          combined += '\n' + new TextDecoder('utf-8', { fatal: false }).decode(buffer);
        }
      }

      if (!combined.trim()) throw new Error('No readable text files found in zip');
      return combined;
    }

    async function readCustomTextFile(file) {
      if (file.name.toLowerCase().endsWith('.zip')) return extractTextFromZip(file);
      try {
        return await file.text();
      } catch (error) {
        const buffer = await file.arrayBuffer();
        return new TextDecoder('utf-8', { fatal: false }).decode(buffer);
      }
    }

    
    els.settingsBtn.onclick = () => els.settingsPanel.classList.toggle('open');
    els.playerBtn.onclick = () => { state.spymaster = false; state.lastRevealed = null; render(); };
    els.spymasterBtn.onclick = () => { state.spymaster = true; state.lastRevealed = null; render(); };
    els.previousGameBtn.onclick = () => {
      if (!previousGameState) { alert('No previous game yet.'); return; }
      clearPending(); state = cloneGameState(previousGameState); selectedSource = state.source || selectedSource; render();
    };
    els.nextBtn.onclick = () => { clearPending(); newGame(true); };
    els.shareGameBtn.onclick = shareGameLink;
    els.downloadPngBtn.onclick = downloadPlayerBoardPng;
    els.clickableSourceOptions.forEach(option => {
      option.onclick = () => { previousSourceSelection = selectedSource; selectedSource = option.dataset.source; newGame(true); };
    });
    els.customFileInput.onchange = async (event) => {
      const loading = els.loadingModal;
      const file = event.target.files?.[0];
      if (!file) { selectedSource = previousSourceSelection; render(); return; }
      loading.classList.add('show');
      const start = performance.now();
      await new Promise(resolve => requestAnimationFrame(resolve));
      try {
        const text = await readCustomTextFile(file);
        banks.custom = extractCustomWords(text);
        if (banks.custom.length < 25) {
          alert(`I found ${banks.custom.length} usable words. Upload a longer text file or use another language.`);
          selectedSource = previousSourceSelection; render(); return;
        }
        previousSourceSelection = selectedSource; selectedSource = 'custom'; newGame(true);
      } catch (error) {
        alert('Could not read that file. Try exporting the chat again or uploading the .txt file directly.');
        selectedSource = previousSourceSelection; render();
      } finally {
        const elapsed = performance.now() - start;
        if (elapsed < 2000) await new Promise(r => setTimeout(r, 2000 - elapsed));
        loading.classList.remove('show'); event.target.value = '';
      }
    };
    els.darkModeToggle.onchange = (event) => { state.darkMode = event.target.checked; state.lastRevealed = null; render(); };
    els.spymasterGuessToggle.onchange = (event) => { state.spymasterMayGuess = event.target.checked; state.lastRevealed = null; render(); };

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y); ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius); ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height); ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius); ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
    }

    function downloadPlayerBoardPng() {
      return new Promise((resolve) => {
        const width = 1920, height = 1080;
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        const isDark = state.darkMode;
        const colors = { bg: isDark ? '#111111' : '#ffffff', text: isDark ? '#f3f3f3' : '#050505', neutral: isDark ? '#2b2b2b' : '#e8e8e8', border: isDark ? '#242424' : '#f0f0f0', red: '#d71920', blue: '#315fb8', gray: '#ecd99f', assassin: '#000000' };
        ctx.fillStyle = colors.bg; ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = colors.text; ctx.font = '700 42px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('CODENAMES', width / 2, 54);
        ctx.fillStyle = colors.border; ctx.fillRect(0, 96, width, 2);
        const redRemaining = state.roles.filter((role, i) => role === 'red' && !state.revealed[i]).length;
        const blueRemaining = state.roles.filter((role, i) => role === 'blue' && !state.revealed[i]).length;
        ctx.font = '44px Arial, Helvetica, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = colors.red; ctx.fillText(redRemaining, 32, 142); ctx.fillStyle = isDark ? '#888888' : '#777777'; ctx.fillText('–', 86, 142); ctx.fillStyle = colors.blue; ctx.fillText(blueRemaining, 122, 142);
        ctx.textAlign = 'center';
        const cols = 5, rows = 5, boardX = 22, boardY = 186, gapX = 34, gapY = 30;
        const cardW = (width - boardX * 2 - gapX * (cols - 1)) / cols;
        const cardH = (height - boardY - 28 - gapY * (rows - 1)) / rows;
        state.words.forEach((word, i) => {
          const x = boardX + (i % cols) * (cardW + gapX), y = boardY + Math.floor(i / cols) * (cardH + gapY);
          const role = state.roles[i]; let fill = colors.neutral, textColor = colors.text;
          if (state.revealed[i]) { if (role === 'red') fill = colors.red; if (role === 'blue') fill = colors.blue; if (role === 'neutral') fill = colors.gray; if (role === 'assassin') fill = colors.assassin; textColor = role === 'neutral' ? '#111111' : '#ffffff'; }
          ctx.fillStyle = fill; roundRect(ctx, x, y, cardW, cardH, 12); ctx.fill();
          ctx.fillStyle = textColor; ctx.font = state.source === 'images' ? '76px Arial, sans-serif' : '700 38px Arial, Helvetica, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(word, x + cardW / 2, y + cardH / 2);
        });
        canvas.toBlob(async (blob) => {
          if (!blob) { resolve(false); return; }
          const fileName = `codenames-board-${Date.now()}.png`;
          const file = new File([blob], fileName, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try { await navigator.share({ files: [file], title: 'Codenames board' }); resolve(true); return; } catch (error) { if (error.name === 'AbortError') { resolve(false); return; } }
          }
          const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = fileName; document.body.appendChild(link); link.click(); document.body.removeChild(link); setTimeout(() => URL.revokeObjectURL(url), 1000); resolve(true);
        }, 'image/png');
      });
    }

    function nudgeSafariChromeAway() {
      const y = Math.min(320, Math.max(140, document.body.scrollHeight - window.innerHeight - 8));
      setTimeout(() => window.scrollTo(0, y), 120);
      setTimeout(() => window.scrollTo(0, y), 550);
      setTimeout(() => window.scrollTo(0, y), 1200);
    }

    window.addEventListener('load', nudgeSafariChromeAway);
    window.addEventListener('orientationchange', nudgeSafariChromeAway);
    window.visualViewport?.addEventListener('resize', () => { if (window.scrollY < 40) nudgeSafariChromeAway(); });
    document.addEventListener('touchend', () => { if (window.scrollY < 1) nudgeSafariChromeAway(); }, { passive: true });

    if (!loadSharedGameFromUrl()) newGame();
  </script>
